name: Prepare Word Pet Storybook native base
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/wordpet-storybook-base.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native storybook edition without touching previous application data
        run: |
          mkdir -p dist/tools/lib64 evidence
          python scripts/prepare_journey.py
          python - <<'PY'
          from pathlib import Path
          p=Path('word-pet-mobile/android-native/app/build.gradle')
          s=p.read_text().replace("applicationId 'com.wordpet.adventure'", "applicationId 'com.wordpet.storybook'").replace('versionCode 150','versionCode 160').replace("versionName '1.5.0'","versionName '1.6.0'")
          p.write_text(s)
          p=Path('word-pet-mobile/android-native/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('\u4f5c\u6587\u5c0f\u4f5c\u5bb6\u00b7\u661f\u8bed\u5c9b','\u4f5c\u6587\u5c0f\u4f5c\u5bb6\u00b7\u7ed8\u672c\u7248'))
          PY
          node --test tests/engine.test.cjs tests/worker.test.mjs tests/journey.test.cjs > evidence/base-unit-tests.tap
      - name: Install official Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile native base
        working-directory: word-pet-mobile/android-native
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Export base and public packaging tools (no private signing key)
        run: |
          cp word-pet-mobile/android-native/app/build/outputs/apk/debug/app-debug.apk dist/native-base.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" dist/tools/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" dist/tools/aapt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" dist/tools/lib64/libc++.so
          cp evidence/base-unit-tests.tap dist/base-unit-tests.tap
          python - <<'PY'
          from pathlib import Path
          import zipfile,json,hashlib
          with zipfile.ZipFile('dist/prepared-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for base in ['word-pet-mobile','redesign','tests','scripts','docs','.github']:
                  for p in Path(base).rglob('*'):
                      if p.is_file() and not any(x in p.parts for x in ['build','.gradle','.git','__pycache__']) and p.suffix not in ['.jks','.keystore']:
                          z.write(p,str(p))
          records={str(p.relative_to('dist')):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('dist').rglob('*') if p.is_file()}
          Path('dist/base-hashes.json').write_text(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wordpet-storybook-native-base-and-tools
          path: dist/
          retention-days: 14
          if-no-files-found: error

name: Build Word Pet Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "word-pet-mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'

      - name: Install Capacitor dependencies
        working-directory: word-pet-mobile/mobile-app
        run: npm ci

      - name: Add Android platform if not committed
        working-directory: word-pet-mobile/mobile-app
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        working-directory: word-pet-mobile/mobile-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: word-pet-mobile
        run: |
          cd mobile-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="word-pet-mobile/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-pet-debug-apk
          path: |
            word-pet-mobile/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

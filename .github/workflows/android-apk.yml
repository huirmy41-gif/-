name: Build and verify Word Pet Adventure APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'word-pet-mobile/android-native/**'
      - 'word-pet-mobile/cloudflare-worker/**'
      - 'redesign/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
concurrency:
  group: wordpet-android-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare original adventure experience
        run: |
          mkdir -p evidence dist
          python scripts/prepare_journey.py
      - name: Unit tests and JavaScript syntax
        run: |
          set -o pipefail
          for file in word-pet-mobile/android-native/app/src/main/assets/*.js; do node --check "$file"; done
          node --check word-pet-mobile/cloudflare-worker/src/index.js
          node --test tests/engine.test.cjs tests/worker.test.mjs tests/journey.test.cjs | tee evidence/unit-tests.tap
      - name: Record optional cloud status without enabling services
        run: |
          python - <<'PY'
          import pathlib,json
          pathlib.Path('evidence/cloud-status.json').write_text(json.dumps({'deployed':False,'reason':'Cloud service not provisioned by this design release; offline use needs no account.','paid_plan_enabled_by_this_script':False}))
          PY
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Phone and tablet browser tests
        run: python tests/browser_test.py
      - name: Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build application and instrumentation APKs
        working-directory: word-pet-mobile/android-native
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Verify APK signature, package and contents
        run: |
          set -o pipefail
          cp word-pet-mobile/android-native/app/build/outputs/apk/debug/app-debug.apk dist/WordPet-Adventure-1.5.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/WordPet-Adventure-1.5.0.apk | tee evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/WordPet-Adventure-1.5.0.apk > evidence/apk-metadata.txt
          python - <<'PY'
          import zipfile,pathlib
          source=pathlib.Path('word-pet-mobile/android-native/app/src/main/assets')
          with zipfile.ZipFile('dist/WordPet-Adventure-1.5.0.apk') as z:
              for p in source.iterdir():
                  if p.is_file(): assert z.read('assets/'+p.name)==p.read_bytes(),p.name
              assert 'classes.dex' in z.namelist()
          print('APK contains exact prepared learning and adventure assets')
          PY
          (cd dist && sha256sum WordPet-Adventure-1.5.0.apk > WordPet-Adventure-1.5.0.apk.sha256)
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android install, startup, storage and workflow tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash scripts/run_emulator.sh
      - name: Assemble verification report and original design notes
        run: |
          python scripts/build_report.py
          cp evidence/cloud-status.json docs/README_CN.md docs/REDESIGN_1_5.md evidence/verification.json evidence/VERIFICATION.md dist/
          cp evidence/*-phone.png evidence/home-tablet.png evidence/android-emulator-home.png dist/
          python - <<'PY'
          import zipfile,pathlib
          root=pathlib.Path('.')
          with zipfile.ZipFile('dist/WordPet-1.5-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in ['redesign','scripts','tests','docs','word-pet-mobile/android-native/app/src/main/assets']:
                  for p in (root/folder).rglob('*'):
                      if p.is_file() and '__pycache__' not in str(p): z.write(p,str(p))
          PY
      - name: Upload downloadable APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: wordpet-adventure-1.5.0
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Publish actual APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="wordpet-1.5.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Word Pet 1.5.0 Adventure family test build ${GITHUB_RUN_NUMBER}" --notes-file evidence/VERIFICATION.md --latest
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpet-adventure-diagnostics
          path: |
            evidence/
            redesign/
            scripts/prepare_journey.py
            tests/browser_test.py
            word-pet-mobile/android-native/app/src/main/assets/
            word-pet-mobile/android-native/app/build/reports/
            word-pet-mobile/android-native/app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn

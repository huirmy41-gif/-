name: Build Word Pet Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "word-pet-mobile/android-native/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: word-pet-mobile/android-native
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: word-pet-mobile/android-native
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK and checksum
        run: |
          APK="word-pet-mobile/android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: word-pet-android-debug-apk
          path: |
            word-pet-mobile/android-native/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

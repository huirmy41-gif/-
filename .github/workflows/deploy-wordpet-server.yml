name: Deploy Word Pet Family Server
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authorized free-plan deployment only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORDPET_PAIR_CODE: ${{ secrets.WORDPET_PAIR_CODE }}
          WORDPET_FREE_PLAN_CONFIRMED: ${{ vars.WORDPET_FREE_PLAN_CONFIRMED }}
          WORDPET_ENABLE_AI: ${{ vars.WORDPET_ENABLE_AI }}
        run: python scripts/deploy_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-deployment-status
          path: evidence/cloud-status.json
          retention-days: 7
